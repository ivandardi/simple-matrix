[package]
edition = '2024'
name = "simple-matrix"
version = "0.2.0"
authors = ["Ivan Dardi <ivanborgiadardi@gmail.com>, Nicolas Mémeint <nicolas.memeint@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ivandardi/simple-matrix"
documentation = "https://docs.rs/simple-matrix"
homepage = "https://github.com/ivandardi/simple-matrix"
description = "A simple generic matrix library"
categories = ["data-structures"]
keywords = ["simple", "matrix", "matrices"]

[package.metadata.docs.rs]
rustdoc-args = [ "--edition=2024" ]

[dev-dependencies]
rand = "0.8"
criterion = "0.5"
quickcheck = "1.0"

[[bench]]
name = "bench"
harness = false
